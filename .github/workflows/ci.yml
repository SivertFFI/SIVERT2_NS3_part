name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build ns-3 + 5G-LENA (examples ON, no Werror)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            git python3 python3-pip \
            libeigen3-dev libgsl-dev libgtk-3-dev libsqlite3-dev libboost-all-dev \
            libzmq3-dev libcppzmq-dev \
            flatbuffers libflatbuffers-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja pkg-config eigen gsl sqlite zeromq cppzmq flatbuffers

      - name: Configure (examples enabled, disable Werror)
        run: |
          ./ns3 configure --enable-examples --disable-werror

      - name: Build
        run: |
          ./ns3 build

      # Optional: Build just the NR API example target if desired
      # - name: Build specific example (optional)
      #   run: |
      #     ./ns3 build cttc-nr-mimo-demo-API
